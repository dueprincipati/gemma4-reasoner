[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gemma4-reasoner"
version = "0.1.0"
description = "Multimodal reasoning engine powered by Gemma 4"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
authors = [
    {name = "Gemma4 Reasoner Contributors"},
]
keywords = ["gemma", "multimodal", "reasoning", "vlm", "ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "Pillow>=11.0",
    "requests>=2.32",
    "rich>=13.0",
    "pydantic>=2.0",
    "typer>=0.12",
]

[project.optional-dependencies]
ollama = ["ollama>=0.4"]
huggingface = [
    "torch>=2.5",
    "transformers>=4.51",
    "accelerate>=1.0",
]
openai = ["openai>=1.0"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.0",
]
all = [
    "gemma4-reasoner[ollama,huggingface,openai]",
]

[project.scripts]
gemma4 = "gemma4_reasoner.cli:app"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
